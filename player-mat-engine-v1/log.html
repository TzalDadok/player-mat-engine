<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AoE BoardGame · Log</title>
  <style>
    :root{--bg:#11100d;--panel:#191713;--ink:#eee6d6;--muted:#9e9482;--gold:#b4975a;--line:#403a30}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif}
    header{height:58px;padding:0 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:20px;position:sticky;top:0;background:#15130f;z-index:10}
    header a{text-decoration:none;color:var(--ink)}
    nav{display:flex;height:100%}
    nav a{display:flex;align-items:center;padding:0 14px;color:var(--muted);font-size:.88rem}
    nav a:hover{color:var(--ink);background:#1b1813}
    main{width:min(1200px,94vw);margin:26px auto 60px}
    .layout{display:grid;grid-template-columns:320px 1fr;gap:18px;align-items:start}
    .sidebar{border:1px solid var(--line);background:var(--panel)}
    .sidebar-head{padding:14px;border-bottom:1px solid var(--line);font-weight:700;letter-spacing:.06em;font-size:.82rem}
    .playtest-list{display:flex;flex-direction:column}
    .playtest-item{width:100%;border:0;border-bottom:1px solid var(--line);border-radius:0;background:transparent;color:var(--ink);padding:14px;text-align:left;display:flex;justify-content:space-between;gap:12px;cursor:pointer;font:14px Arial}
    .playtest-item:last-child{border-bottom:0}
    .playtest-item:hover,.playtest-item.active{background:#242019}
    .playtest-item.active{color:var(--gold)}
    .arrow{color:var(--gold)}
    .content-wrap{border:1px solid var(--line);background:var(--panel);min-height:420px}
    article{padding:clamp(20px,3vw,40px);line-height:1.55}
    article h1{font:700 2rem Georgia,serif;margin-top:0}
    article h2{font:700 1.35rem Georgia,serif;color:var(--gold);margin-top:1.8em}
    article h3{font:700 1.05rem Georgia,serif;margin-top:1.5em}
    article p,article li{color:#d8cebd}
    article ul{padding-left:24px}
    .placeholder,.error{padding:30px;color:var(--muted)}
    @media(max-width:760px){
      header{height:auto;min-height:58px;align-items:flex-start;flex-direction:column;padding:14px 16px}
      nav{height:auto;flex-wrap:wrap}
      nav a{padding:7px 10px}
      .layout{grid-template-columns:1fr}
    }
  </style>
</head>
<body>
<header>
  <a href="index.html"><strong>AoE BoardGame / Log</strong></a>
  <nav>
    <a href="index.html">Dashboard</a>
    <a href="mats.html">Mats</a>
    <a href="simulator/index.html">Simulador</a>
    <a href="reglamento.html">Reglamento</a>
  </nav>
</header>

<main>
  <div class="layout">
    <aside class="sidebar">
      <div class="sidebar-head">PLAYTESTS</div>
      <div class="playtest-list" id="playtestList"></div>
    </aside>

    <section class="content-wrap">
      <article id="content"><div class="placeholder">Cargando playtests…</div></article>
    </section>
  </div>
</main>

<script src="playtests-data.js"></script>
<script>
const esc=s=>String(s??'').replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));

function renderMarkdown(md){
  const lines=md.replace(/\r/g,'').split('\n');
  let html='',inList=false;
  const closeList=()=>{if(inList){html+='</ul>';inList=false}};
  for(const raw of lines){
    const line=raw.trim();
    if(!line){closeList();continue}
    if(line.startsWith('### ')){closeList();html+='<h3>'+esc(line.slice(4))+'</h3>';continue}
    if(line.startsWith('## ')){closeList();html+='<h2>'+esc(line.slice(3))+'</h2>';continue}
    if(line.startsWith('# ')){closeList();html+='<h1>'+esc(line.slice(2))+'</h1>';continue}
    if(line.startsWith('- ')){
      if(!inList){html+='<ul>';inList=true}
      html+='<li>'+esc(line.slice(2)).replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>')+'</li>';continue
    }
    closeList();
    html+='<p>'+esc(line).replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>')+'</p>';
  }
  closeList();return html;
}

function prettyName(name){
  return name.replace(/\.md$/,'')
    .replace(/^(\d{4})-(\d{2})-(\d{2})-/,'$3/$2/$1 · ')
    .replace(/-/g,' ');
}

function loadPlaytest(index){
  const data=(window.PLAYTESTS||[])[index];
  if(!data) return;
  document.querySelectorAll('.playtest-item').forEach(x=>x.classList.remove('active'));
  const btn=document.querySelector('[data-index="'+index+'"]');
  if(btn) btn.classList.add('active');
  document.getElementById('content').innerHTML=renderMarkdown(data.content);
  history.replaceState(null,'','#'+data.name.replace(/\.md$/,''));
}

const data=(window.PLAYTESTS||[]).slice().sort((a,b)=>b.name.localeCompare(a.name));
window.PLAYTESTS=data;
const list=document.getElementById('playtestList');

if(!data.length){
  list.innerHTML='<div class="placeholder">No hay playtests.</div>';
  document.getElementById('content').innerHTML='<div class="placeholder">No hay playtests disponibles.</div>';
}else{
  list.innerHTML=data.map((p,i)=>'<button class="playtest-item" data-index="'+i+'"><span>'+esc(prettyName(p.name))+'</span><span class="arrow">→</span></button>').join('');
  list.querySelectorAll('.playtest-item').forEach(btn=>btn.addEventListener('click',()=>loadPlaytest(Number(btn.dataset.index))));
  const hash=location.hash.slice(1);
  const idx=data.findIndex(p=>p.name.replace(/\.md$/,'')===hash);
  loadPlaytest(idx>=0?idx:0);
}
</script>
</body>
</html>
