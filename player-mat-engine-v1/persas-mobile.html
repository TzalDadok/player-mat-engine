<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#192b22">
<title>AEVUM · Persas móvil</title>
<style>
:root{color-scheme:dark;--bg:#111d18;--panel:#24372d;--gold:#ebc980;--ink:#f9f0d8;--muted:#c3bba2}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,Arial,sans-serif}button{font:inherit;cursor:pointer;color:inherit}button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.shell{height:100dvh;min-height:270px;display:flex;flex-direction:column;overflow:hidden}
header{display:flex;align-items:center;justify-content:space-between;gap:9px;flex:0 0 auto;padding:5px 9px;background:#192b22;border-bottom:1px solid #9d824a}
.brand{display:flex;align-items:center;gap:7px;min-width:0}.brand img{width:35px;height:35px;object-fit:cover;border-radius:5px}.brand strong{font-family:Georgia,serif;color:var(--gold);font-size:17px;letter-spacing:.08em}.brand small{display:block;color:var(--muted);font-size:10px}
.actions{display:flex;align-items:center;gap:5px}.btn{background:#304537;border:1px solid #9e8757;padding:7px 9px;border-radius:7px;font-size:11px;font-weight:700;white-space:nowrap}.btn.primary{background:#b49352;color:#211b12}.btn:disabled{opacity:.38;cursor:not-allowed}
.ages{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;padding:6px 8px;flex:0 0 auto}
.age{padding:5px 3px;border-radius:7px;border:1px solid #536b56;background:#25382c;text-align:center;font-weight:700;font-size:11px}.age span{color:var(--muted);font-weight:400;font-size:10px}.age.current{background:#537347;border-color:#f1c46e}.age.future{border-style:dashed;border-color:#caa963}.age.locked{opacity:.32;cursor:default}
.status{padding:0 9px 5px;display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:11px;color:var(--muted);flex:0 0 auto}.status strong{color:var(--gold)}.status .requirement{max-width:65%;text-align:right}
.board{flex:1;min-height:0;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;padding:3px 8px 8px}
.column{background:#1d2f25;border:1px solid #536649;border-radius:8px;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.column-head{display:flex;align-items:center;justify-content:center;gap:4px;flex:0 0 auto;background:#354636;border-bottom:1px solid #89764c;padding:4px 2px;min-height:33px}
.column-head img{height:26px;width:32px;object-fit:cover;border-radius:3px}.column-head b{font-size:10px;line-height:1.1}.column-head{width:100%;color:var(--ink);font:inherit;cursor:pointer}.column-head:disabled{opacity:1;cursor:default}.column-head.header-built{background:#4b7345;border-color:#acd88a}.column-head.header-built b{color:#d8ffc3}.building-label{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:0;gap:2px}.building-price{display:block;font-size:10px;color:#f6d48b;font-weight:700;white-space:normal;line-height:1.1}.column-head{min-height:40px}
.tiles{padding:5px;display:grid;grid-auto-rows:minmax(0,1fr);gap:5px;flex:1;min-height:0}
.tile{min-height:0;border-radius:6px;padding:6px 4px;border:1px solid #6a925c;background:#30442e;text-align:center;display:flex;flex-direction:column;justify-content:center;gap:3px;overflow:hidden}
.tile.tech{background:#30492f;border-color:#86ac6d}.tile.building,.tile.military-building{background:#4a3828;border-color:#c3975f}.tile.unit,.tile.civil{background:#263d49;border-color:#779fb3}
.tile.checked{background:#487047;border:2px solid #bce5a0}.tile strong{font-size:clamp(9px,1.4vw,13px);line-height:1.15;overflow-wrap:anywhere}.tile small{font-size:clamp(8px,1.05vw,11px);color:#e6d19d;line-height:1.1}.tile .mark{font-size:10px;font-weight:700;color:#c1efae}.tile.preview{opacity:.75}
.empty{align-self:center;justify-self:center;color:#a3a996;font-size:12px;text-align:center;padding:12px}
dialog{background:#20352a;color:var(--ink);border:2px solid #b99755;border-radius:13px;padding:0;width:min(440px,92vw);max-height:90dvh;box-shadow:0 15px 55px #000b}dialog::backdrop{background:#020805b9}
.dialog-body{padding:17px;overflow:auto;max-height:85dvh}.dialog-type{color:var(--gold);font-size:11px;text-transform:uppercase;letter-spacing:.1em}.dialog-body h2{margin:5px 0 8px;font:700 22px Georgia,serif}.dialog-body p{font-size:14px;line-height:1.5}.dialog-cost{font-weight:700;color:#f5cd7a}.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;flex-wrap:wrap}
#notice{position:fixed;bottom:7px;left:50%;transform:translateX(-50%);background:#34503c;border:1px solid #b79b63;border-radius:7px;padding:7px 12px;font-size:11px;max-width:90vw;z-index:3;display:none}
@media(orientation:portrait){.shell:before{content:"↻ Girá el celular para usar el mat horizontalmente";position:fixed;inset:0;display:grid;place-items:center;text-align:center;padding:30px;background:#14281c;font-size:20px;z-index:20}}
@media(max-height:390px){header{padding:3px 8px}.brand img{width:26px;height:26px}.ages{padding:3px 8px}.age{padding:3px}.status{padding-bottom:2px}.column-head{min-height:27px}.column-head img{height:20px;width:25px}.tiles{gap:3px;padding:3px}.tile{padding:3px}}
</style></head><body>
<div class="shell"><header><div class="brand"><img src="assets/ui/Emblema%20Persa%20Dorado%20con%20Alas.png" alt=""><div><strong>PERSAS</strong><small>AEVUM · MAT MÓVIL</small></div></div><div class="actions"><button class="btn primary" id="advance">Avanzar Edad →</button><button class="btn" id="reset">Reiniciar</button></div></header>
<nav class="ages" id="ages"></nav><div class="status"><span id="view"></span><span class="requirement" id="requirement"></span></div><main class="board" id="board"></main></div>
<dialog id="details"><div class="dialog-body"><div class="dialog-type" id="type"></div><h2 id="name"></h2><div class="dialog-cost" id="cost"></div><p id="description"></p><div class="dialog-actions"><button class="btn" id="close">Cerrar</button><button class="btn primary" id="toggle"></button></div></div></dialog>
<div id="notice" role="status"></div><script src="civs/persas.js"></script>
<script>
(()=>{
const civ=window.PLAYER_MAT_CIVS.persas,ages=civ.ages;
const res={food:'🥩',wood:'🪵',stone:'🪨',gold:'🪙'},types={tech:'Tecnología',building:'Construcción','military-building':'Construcción militar',unit:'Unidad',civil:'Unidad económica'};
const nodes=[];const seen=new Set();for(const n of civ.nodes){const k=[n.age,n.building,n.type,n.title].join('|');if(!seen.has(k)){nodes.push(n);seen.add(k)}}
let current=0,view=0,selected=null;const developed=new Set();const builtHeaders=new Set();
const $=id=>document.getElementById(id),key=n=>nodes.indexOf(n),isBuilding=n=>(n.type==='building'||n.type==='military-building')&&n.title!=='Granja',markable=n=>isBuilding(n)||n.type==='tech';
const money=o=>o?Object.entries(o).map(([k,v])=>res[k]+' '+v).join('  '):'Sin costo';
function builds(){return nodes.filter(n=>n.age===ages[current].id&&isBuilding(n))}
function baseBuildings(){return current===0?civ.buildings.filter(b=>b.id!=='tc'):[]}
function hasBuilding(){const b=builds();return b.some(n=>developed.has(key(n)))||baseBuildings().some(b=>builtHeaders.has(b.id))}
function canAdvance(){return current<ages.length-1&&(!builds().length&&!baseBuildings().length||hasBuilding())}
function flash(t){const n=$('notice');n.textContent=t;n.style.display='block';n.onclick=()=>n.style.display='none'}
function render(){
$('ages').innerHTML=ages.map((a,i)=>'<button data-age="'+i+'" class="age '+(i===current?'current':i===current+1?'future':i>current+1?'locked':'')+'" '+(i>current+1?'disabled':'')+'>'+a.roman+' · '+a.name.replace('EDAD DE LOS ','').replace('EDAD ','')+(i===current?' ✓':i===current+1?' 👁':'')+'</button>').join('');
$('view').innerHTML=(view===current?'<strong>EDAD ACTUAL</strong>':'<strong>VISTA PREVIA · NO DISPONIBLE</strong>')+' · '+ages[view].name+(view<current?' · Edad anterior':'');
const b=builds(),base=baseBuildings();$('requirement').textContent=view===current?(b.length||base.length?'Para avanzar: '+(hasBuilding()?'✓ construcción registrada':'marcá una construcción de esta Edad'):'Sin construcción obligatoria en esta Edad'):'Tocá la Edad actual para volver';
$('advance').disabled=view!==current||!canAdvance();
$('board').style.gridTemplateColumns='repeat('+civ.buildings.length+',minmax(0,1fr))';
$('board').innerHTML=civ.buildings.map(col=>{
const entries=nodes.filter(n=>n.age===ages[view].id&&n.building===col.id);
const headerActive=col.id!=='tc'&&view===0&&view<=current;
return '<section class="column"><button class="column-head '+(builtHeaders.has(col.id)?'header-built':'')+'" data-building="'+col.id+'" '+(!headerActive?'disabled':'')+'><img src="'+col.image+'" alt=""><span class="building-label"><b>'+col.name+(builtHeaders.has(col.id)?' ✓':'')+'</b>'+(col.cost?'<small class="building-price">'+money(col.cost)+'</small>':'')+'</span></button><div class="tiles">'+(entries.length?entries.map(n=>{
const i=key(n),done=developed.has(i);
return '<button class="tile '+n.type+(done?' checked':'')+(view>current?' preview':'')+'" data-node="'+i+'"><strong>'+n.title+'</strong><small>'+money(n.cost)+'</small>'+(markable(n)?'<span class="mark">'+(done?'✓ DESARROLLADO':view>current?'◌ PRÓXIMA EDAD':'○ PENDIENTE')+'</span>':'')+'</button>';
}).join(''):'<div class="empty">—</div>')+'</div></section>';
}).join('');
}
$('ages').onclick=e=>{const el=e.target.closest('[data-age]');if(!el)return;const i=Number(el.dataset.age);if(i<=current+1){view=i;render()}};
$('board').onclick=e=>{const head=e.target.closest('[data-building]');if(head){if(view!==0||view>current||head.dataset.building==='tc')return;const id=head.dataset.building;if(builtHeaders.has(id))builtHeaders.delete(id);else builtHeaders.add(id);render();return;}const el=e.target.closest('[data-node]');if(!el)return;selected=Number(el.dataset.node);const n=nodes[selected];$('type').textContent=types[n.type];$('name').textContent=n.title;$('cost').textContent=money(n.cost);$('description').textContent=n.text||(n.stats?'Fuerza: '+(n.stats.force??'—')+' · Alcance: '+(n.stats.range??'—')+' · Movimiento: '+(n.stats.move??'—'):'Disponible desde esta Edad.');
const allowed=markable(n)&&view<=current;$('toggle').hidden=!allowed;if(allowed)$('toggle').textContent=developed.has(selected)?'Desmarcar':'Marcar como '+(isBuilding(n)?'construido':'investigado');$('details').showModal();
};
$('close').onclick=()=>$('details').close();
$('toggle').onclick=()=>{if(selected===null)return;const n=nodes[selected];if(!markable(n)||view>current)return;if(developed.has(selected))developed.delete(selected);else developed.add(selected);$('details').close();render()};
$('advance').onclick=()=>{if(!canAdvance()||view!==current)return;const cost=money(ages[current+1].cost);if(!confirm('¿Avanzar a '+ages[current+1].name+'?\nCosto: '+cost+'\nConfirmá después de pagar los recursos en el tablero.'))return;current++;view=current;render()};
$('reset').onclick=()=>{if(!confirm('¿Seguro que querés reiniciar el mat? Se perderán todas las marcas de esta partida.'))return;current=0;view=0;developed.clear();builtHeaders.clear();render();flash('Mat reiniciado')};
render();
})();
</script></body></html>
