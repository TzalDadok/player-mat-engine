<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Player Mat Engine v1</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="toolbar no-print">
    <strong>Player Mat Engine v1</strong>
    <label>Civilización <select id="civSelect"></select></label>
    <button id="toggleGrid">Guías</button>
    <button id="printBtn">Imprimir / PDF</button>
    <button id="print1v1Btn">Imprimir 1v1 A3</button>
    <button id="print1v1A4Btn">Imprimir 1v1 A4</button>
    <span class="hint">Civilizaciones cargadas desde <code>civs/*.js</code>.</span>
  </div>

  <main id="mat" class="mat">
    <div id="reference" class="reference-layer"></div>
    <aside id="sidebar" class="sidebar"></aside>
    <section id="tree" class="tree"></section>
  </main>

  <section id="print1v1" class="print-1v1-sheet" aria-hidden="true"></section>

  <script src="civs/britones.js"></script>
  <script src="civs/francos.js"></script>
  <script src="civs/vikingos.js"></script>
  <script src="app.js"></script>
</body>
</html>
