<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AoE BoardGame</title>
  <link rel="stylesheet" href="dashboard.css">
</head>
<body>
  <header class="topbar">
    <strong class="brand">AoE BoardGame</strong>
    <nav class="nav">
      <a href="mats.html">Mats</a>
      <a href="log.html">Log</a>
      <a href="reglamento.html">Reglamento</a>
    </nav>
  </header>

  <main class="dashboard">
    <section class="column" id="en-prueba">
      <div class="section-head">
        <h2>EN PRUEBA</h2>
        <span class="status" id="testingStatus"></span>
      </div>

      <form class="note-form" data-type="testing">
        <textarea id="testingInput" placeholder="Agregar una nota..."></textarea>
        <button type="submit">Agregar</button>
      </form>

      <div class="notes-list" id="testingList"></div>
    </section>

    <section class="column" id="changelog">
      <div class="section-head">
        <h2>CHANGELOG</h2>
        <span class="status" id="changelogStatus"></span>
      </div>

      <div class="notes-list" id="changelogList"></div>
    </section>
  </main>

  <script src="runtime-config.js"></script>
  <script src="dashboard-guard.js"></script>
  <script src="dashboard.js"></script>
</body>
</html>
