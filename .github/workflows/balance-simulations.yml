name: Balance Simulations

on:
  workflow_dispatch:
    inputs:
      benchmark_seeds:
        description: Fixed benchmark maps to use (max 40, 4 seat rotations each)
        required: false
        default: "40"
      max_rounds:
        description: Maximum rounds per game
        required: false
        default: "400"
  push:
    branches:
      - main
    paths:
      - "player-mat-engine-v1/simulator/bots/**"
      - "player-mat-engine-v1/simulator/runner/**"
      - "player-mat-engine-v1/simulator/maps/**"
      - "player-mat-engine-v1/simulator/engine/**"
      - "player-mat-engine-v1/simulator/civs/**"
      - ".github/workflows/balance-simulations.yml"

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run fixed balance benchmark
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_SEEDS: ${{ github.event.inputs.benchmark_seeds }}
          INPUT_MAX_ROUNDS: ${{ github.event.inputs.max_rounds }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            SEEDS="${INPUT_SEEDS:-40}"
            MAX_ROUNDS="${INPUT_MAX_ROUNDS:-300}"
          else
            SEEDS="10"
            MAX_ROUNDS="400"
          fi

          node player-mat-engine-v1/simulator/runner/run-benchmark.mjs "$SEEDS" "$MAX_ROUNDS"

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: balance-benchmark-${{ github.run_number }}
          path: |
            benchmark-results.json
            benchmark-summary.md
          retention-days: 30
