name: Deploy Player Mat Engine to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "player-mat-engine-v1/**"
      - "playtests/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Test simulator engine
        run: |
          node player-mat-engine-v1/simulator/tests/hito1-smoke.mjs
          node player-mat-engine-v1/simulator/tests/civilizations-smoke.mjs
          node player-mat-engine-v1/simulator/tests/combat-advanced-smoke.mjs
          node player-mat-engine-v1/simulator/tests/special-units-smoke.mjs
          node player-mat-engine-v1/simulator/tests/conversion-garrison-naval-smoke.mjs
          node player-mat-engine-v1/simulator/tests/ffa36-smoke.mjs
          node player-mat-engine-v1/simulator/tests/exploration-relic-smoke.mjs
          node player-mat-engine-v1/simulator/tests/economic-special-smoke.mjs
          node player-mat-engine-v1/simulator/tests/exploration-cards-smoke.mjs
          node player-mat-engine-v1/simulator/tests/competitive-scoring-smoke.mjs
          node player-mat-engine-v1/simulator/tests/hito2-bots-smoke.mjs
          node --check player-mat-engine-v1/simulator/app.js
          node --check player-mat-engine-v1/simulator/engine/game.js
          node --check player-mat-engine-v1/simulator/bots/baseline.js
          node --check player-mat-engine-v1/simulator/bots/profiles.js
          node --check player-mat-engine-v1/simulator/runner/simulate.js
          node --check player-mat-engine-v1/simulator/runner/batch.mjs
          node --check player-mat-engine-v1/simulator/runner/benchmark.mjs
          node --check player-mat-engine-v1/simulator/runner/benchmark-seeds.js
          node --check player-mat-engine-v1/simulator/maps/ffa36.js
          node --check player-mat-engine-v1/simulator/runner/run-benchmark.mjs
          node --check player-mat-engine-v1/simulator/runner/duel-benchmark.mjs

      - name: Build playtest data
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          rows = []
          for path in sorted(Path("playtests").glob("*.md"), reverse=True):
              rows.append({
                  "name": path.name,
                  "content": path.read_text(encoding="utf-8")
              })

          out = "window.PLAYTESTS = " + json.dumps(rows, ensure_ascii=False) + ";\n"
          Path("player-mat-engine-v1/playtests-data.js").write_text(out, encoding="utf-8")
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Player Mat Engine
        uses: actions/upload-pages-artifact@v4
        with:
          path: player-mat-engine-v1

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
