name: Deploy Player Mat Engine to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "player-mat-engine-v1/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Player Mat Engine
        uses: actions/upload-pages-artifact@v4
        with:
          path: player-mat-engine-v1

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
