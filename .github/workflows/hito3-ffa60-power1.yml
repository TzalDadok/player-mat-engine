name: Hito 3 FFA60 fourth CU starts with one military power
on:
  push:
    paths:
      - '.github/workflows/hito3-ffa60-power1.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  power-one:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: player-mat-engine-v1/simulator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify starting positions and power allocation
        run: node runner/run-ffa60-power1-40.mjs 1
      - name: Run 40-seed comparison (2560 games)
        run: node runner/run-ffa60-power1-40.mjs 40
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: hito3-ffa60-power1-40
          path: |
            player-mat-engine-v1/simulator/results/hito3-ffa60-power1-40.md
            player-mat-engine-v1/simulator/results/hito3-ffa60-power1-40.json
      - name: Save results to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/hito3-ffa60-power1-40.md results/hito3-ffa60-power1-40.json
          if ! git diff --cached --quiet; then
            git commit -m "Record Hito 3 fourth CU one power results [skip ci]"
            git pull --rebase origin main
            git push
          fi
