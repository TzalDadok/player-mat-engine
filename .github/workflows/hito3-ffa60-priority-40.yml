name: Hito 3 FFA60 40-seed balanced priority
on:
  push:
    paths:
      - '.github/workflows/hito3-ffa60-priority-40.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  simulation:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: player-mat-engine-v1/simulator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run 2560 FFA60 three-villager games
        run: node runner/run-ffa60-priority-40.mjs
      - name: Publish simulation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hito3-ffa60-priority-40
          path: |
            player-mat-engine-v1/simulator/results/hito3-ffa60-priority-40.md
            player-mat-engine-v1/simulator/results/hito3-ffa60-priority-40.json
      - name: Save report to GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/hito3-ffa60-priority-40.md results/hito3-ffa60-priority-40.json
          if ! git diff --cached --quiet; then
            git commit -m "Record FFA60 40-seed balanced-priority results [skip ci]"
            git push
          fi
