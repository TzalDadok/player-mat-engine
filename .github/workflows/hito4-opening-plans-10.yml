name: Hito 4 ten-round legal opening plans
on:
  push:
    paths:
      - '.github/workflows/hito4-opening-plans-10.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  openings:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: player-mat-engine-v1/simulator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Smoke test legal economic planning
        run: node runner/compare-human-openings-10.mjs 1
      - name: Compare 10-round plans on 40 maps
        run: node runner/compare-human-openings-10.mjs 40
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: hito4-opening-plans-10
          path: |
            player-mat-engine-v1/simulator/results/hito4-opening-plans-10.md
            player-mat-engine-v1/simulator/results/hito4-opening-plans-10.json
      - name: Save results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/hito4-opening-plans-10.md results/hito4-opening-plans-10.json
          if ! git diff --cached --quiet; then
            git commit -m "Record 10-round legal opening strategy comparison [skip ci]"
            git pull --rebase origin main
            git push
          fi
