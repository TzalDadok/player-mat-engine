name: Fast logistics bot validation - isolated food bridge only
on:
  push:
    paths:
      - '.github/workflows/logistics-bot-fast.yml'
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: player-mat-engine-v1/simulator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check bots/baseline.js
      - run: node runner/diagnose-logistics-70.mjs
