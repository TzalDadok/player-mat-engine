name: Hito 5 manual full logistics comparison
on:
  push:
    paths:
      - '.github/workflows/hito5-manual-logistics.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    defaults:
      run:
        working-directory: player-mat-engine-v1/simulator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Smoke test
        run: node runner/compare-manual-full-logistics.mjs 1
      - name: Ten-map matched experiment
        run: node runner/compare-manual-full-logistics.mjs 10
      - uses: actions/upload-artifact@v4
        with:
          name: hito5-manual-full-logistics
          path: |
            player-mat-engine-v1/simulator/results/hito5-manual-full-logistics.md
            player-mat-engine-v1/simulator/results/hito5-manual-full-logistics.json
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/hito5-manual-full-logistics.md results/hito5-manual-full-logistics.json
          if ! git diff --cached --quiet; then
            git commit -m "Record manual-production logistics comparison [skip ci]"
            git pull --rebase origin main
            git push
          fi
