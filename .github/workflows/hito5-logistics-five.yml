name: Hito 5 logistics corrected bots 5 maps
on:
  push:
    paths:
      - '.github/workflows/hito5-logistics-five.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    defaults:
      run:
        working-directory: player-mat-engine-v1/simulator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run 5 maps 160 games
        run: node runner/compare-manual-logistics-five-map.mjs 5
      - uses: actions/upload-artifact@v4
        with:
          name: logistics-corrected-five-maps
          path: |
            player-mat-engine-v1/simulator/results/hito5-manual-logistics-five-map.md
            player-mat-engine-v1/simulator/results/hito5-manual-logistics-five-map.json
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/hito5-manual-logistics-five-map.md results/hito5-manual-logistics-five-map.json
          if ! git diff --cached --quiet; then
            git commit -m "Record corrected logistics 5-map comparison [skip ci]"
            git pull --rebase origin main
            git push
          fi
