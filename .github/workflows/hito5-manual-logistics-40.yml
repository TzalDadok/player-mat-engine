name: Hito 5 full 40-map logistics bot comparison
on:
  push:
    paths:
      - '.github/workflows/hito5-manual-logistics-40.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    defaults:
      run:
        working-directory: player-mat-engine-v1/simulator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Full forty-map matched comparison
        run: node runner/compare-manual-full-logistics-40.mjs 40
      - uses: actions/upload-artifact@v4
        with:
          name: hito5-manual-full-logistics-40
          path: |
            player-mat-engine-v1/simulator/results/hito5-manual-full-logistics-40.md
            player-mat-engine-v1/simulator/results/hito5-manual-full-logistics-40.json
      - name: Save report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/hito5-manual-full-logistics-40.md results/hito5-manual-full-logistics-40.json
          if ! git diff --cached --quiet; then
            git commit -m "Record 40-map logistics adapted bot comparison [skip ci]"
            git pull --rebase origin main
            git push
          fi
