name: Hito 3 map-size comparison
on:
  push:
    paths:
      - '.github/workflows/hito3-map-size.yml'
      - 'player-mat-engine-v1/simulator/**'
  workflow_dispatch:
jobs:
  map-size:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: player-mat-engine-v1/simulator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compare FFA36 and FFA60 on 10 seeds
        run: node runner/run-map-size-experiment.mjs 10
      - name: Upload experiment results
        uses: actions/upload-artifact@v4
        with:
          name: hito3-experiment-d-ffa60
          path: |
            player-mat-engine-v1/simulator/results/hito3-experiment-d-ffa60.json
            player-mat-engine-v1/simulator/results/hito3-experiment-d-ffa60.md
