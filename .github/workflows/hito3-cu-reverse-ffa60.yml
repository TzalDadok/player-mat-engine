name: Hito 3 FFA60 reverse CU experiment
on:
  push:
    paths:
      - '.github/workflows/hito3-cu-reverse-ffa60.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  reverse-cu:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: player-mat-engine-v1/simulator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Simulate 160 normal CU and 160 reverse CU FFA60 games
        run: node runner/run-cu-reverse-ffa60.mjs 10
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: hito3-experiment-e-reverse-cu-ffa60
          path: |
            player-mat-engine-v1/simulator/results/hito3-experiment-e-reverse-cu-ffa60.json
            player-mat-engine-v1/simulator/results/hito3-experiment-e-reverse-cu-ffa60.md
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/hito3-experiment-e-reverse-cu-ffa60.json results/hito3-experiment-e-reverse-cu-ffa60.md
          if ! git diff --cached --quiet; then
            git commit -m "Record FFA60 reverse CU experiment results [skip ci]"
            git push
          fi
