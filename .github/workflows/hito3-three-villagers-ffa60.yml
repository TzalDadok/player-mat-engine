name: Hito 3 FFA60 three villagers
on:
  push:
    paths:
      - '.github/workflows/hito3-three-villagers-ffa60.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  three-villagers:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: player-mat-engine-v1/simulator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run three villager FFA60 simulation
        run: node runner/run-three-villagers-ffa60.mjs 10
      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: hito3-three-villagers-ffa60
          path: |
            player-mat-engine-v1/simulator/results/hito3-three-villagers-ffa60.json
            player-mat-engine-v1/simulator/results/hito3-three-villagers-ffa60.md
      - name: Store report in repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/hito3-three-villagers-ffa60.json results/hito3-three-villagers-ffa60.md
          if ! git diff --cached --quiet; then
            git commit -m "Record three-villager FFA60 simulation [skip ci]"
            git push
          fi
