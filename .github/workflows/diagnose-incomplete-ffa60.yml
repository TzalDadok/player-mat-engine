name: Diagnose incomplete FFA60 games
on:
  push:
    paths:
      - '.github/workflows/diagnose-incomplete-ffa60.yml'
  workflow_dispatch:
jobs:
  diagnose:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: player-mat-engine-v1/simulator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node runner/diagnose-incomplete-ffa60.mjs
