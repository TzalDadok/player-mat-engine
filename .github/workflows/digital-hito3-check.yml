name: Digital - validar Hito 3
on:
  push:
    paths:
      - 'digital/**'
      - '.github/workflows/digital-hito3-check.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: digital
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: npm run build
      - run: node tests/hito3-smoke.mjs
        timeout-minutes: 4
