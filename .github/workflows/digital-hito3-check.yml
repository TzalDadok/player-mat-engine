name: Digital - validar Hito 3
on:
  push:
    paths:
      - 'digital/**'
      - 'player-mat-engine-v1/civs/**'
      - '.github/workflows/digital-hito3-check.yml'
  workflow_dispatch:
concurrency:
  group: aoe-digital-hito3
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: digital
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: node tests/mat-sync.mjs
      - run: npm run check
      - run: npm run build
      - run: node tests/hito3-smoke.mjs
        timeout-minutes: 4
      - run: npx playwright install --with-deps chromium
        timeout-minutes: 6
      - run: node tests/hito3-browser.mjs
        timeout-minutes: 4
