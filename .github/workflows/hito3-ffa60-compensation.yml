name: Hito 3 FFA60 compensated starts 40 seeds
on:
  push:
    paths:
      - '.github/workflows/hito3-ffa60-compensation.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  compensation:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: player-mat-engine-v1/simulator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Smoke-test placements, villagers and military power on first map
        run: node runner/run-ffa60-staggered-40.mjs 1
      - name: Run 40 seed balanced priority compensation experiment
        run: node runner/run-ffa60-staggered-40.mjs 40
      - name: Publish results
        uses: actions/upload-artifact@v4
        with:
          name: hito3-ffa60-compensated-40
          path: |
            player-mat-engine-v1/simulator/results/hito3-ffa60-staggered-40.md
            player-mat-engine-v1/simulator/results/hito3-ffa60-staggered-40.json
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/hito3-ffa60-staggered-40.md results/hito3-ffa60-staggered-40.json
          if ! git diff --cached --quiet; then
            git commit -m "Record FFA60 compensated starts results [skip ci]"
            git pull --rebase origin main
            git push
          fi
